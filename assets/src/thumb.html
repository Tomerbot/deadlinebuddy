<!doctype html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
body{margin:0;width:1200px;height:800px;background:#D5DEDB;font-family:'Atkinson Hyperlegible';color:#17202B;overflow:hidden}
.wrap{padding:64px 70px}
h1{font:800 76px/1.02 'Bricolage Grotesque';margin:0 0 18px;letter-spacing:-.02em}
p{font-size:28px;margin:0;color:#3d4955}
.dev{position:absolute;left:70px;right:70px;bottom:-40px;height:440px;background:#17202B;border-radius:36px;padding:22px}
.scr{background:#EAF0EE;height:100%;border-radius:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px;align-items:end;padding:30px 34px 70px}
.c{display:flex;flex-direction:column-reverse;gap:3px;height:100%;border-bottom:3px solid #17202B;position:relative}
.b{border-radius:6px 6px 2px 2px}
.f{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#17202B;color:#fff;font:700 17px 'Atkinson Hyperlegible';padding:4px 10px;border-radius:5px;white-space:nowrap}
.l{position:absolute;bottom:-34px;width:100%;text-align:center;font:700 20px 'Atkinson Hyperlegible'}
.t{background:#F0AE2E;border-radius:0 0 8px 8px}
.m{position:absolute;top:12px;left:0;right:0;border-top:3px dashed #CBD6D3}
</style></head><body><div class="wrap">
<h1>“Alexa, I have a science<br>project due Friday.”</h1>
<p>DeadlineBuddy plans every day before it, and re-plans when you fall behind.</p></div>
<div class="dev"><div class="scr">
<div class="c"><div class="b" style="height:45%;background:#0E9AA0"></div><div class="b" style="height:18%;background:#5B4B8A"></div><span class="l t">Mon</span></div>
<div class="c"><div class="b" style="height:20%;background:#0E9AA0"></div><span class="l">Tue</span></div>
<div class="c"><div class="b" style="height:66%;background:#5B4B8A"></div><span class="f" style="border-bottom:3px solid #0E9AA0">Math test</span><span class="l">Wed</span></div>
<div class="c"><div class="b" style="height:66%;background:#5B4B8A"></div><span class="l">Thu</span></div>
<div class="c"><span class="f" style="border-bottom:3px solid #5B4B8A">Science fair</span><span class="l">Fri</span></div>
<div class="c"><span class="l">Sat</span></div>
<div class="c"><span class="l">Sun</span></div>
</div></div></body></html>
